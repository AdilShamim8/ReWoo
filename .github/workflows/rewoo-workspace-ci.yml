name: ReWoo Workspace CI

on:
  push:
    paths:
      - "you/**"
      - ".github/workflows/rewoo-workspace-ci.yml"
  pull_request:
    paths:
      - "you/**"
      - ".github/workflows/rewoo-workspace-ci.yml"

defaults:
  run:
    working-directory: you

jobs:
  rewoo-workspace:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./db/rewoo.db
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build
