services:
  rewoo:
    build: .
    ports:
      - "8787:8787"
    env_file:
      - path: .env
        required: false
    environment:
      REWOO_PUBLIC_URL: http://localhost:8787
      # Reach Ollama running on your computer from inside Docker:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - rewoo-data:/data
volumes:
  rewoo-data:
